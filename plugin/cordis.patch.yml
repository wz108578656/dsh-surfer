# dsh-surfer bundle layer: open .vcd / .fst / .ghw in the right sidebar with Surfer WASM.
#
# The Host half does not read files. The Client half registers an
# extension-priority file tab and loads https://app.surfer-project.org assets
# inside a same-origin iframe. There is no Host config: the asset origin and
# the 32 MiB complete-file cap are fixed in the client.
- insert:
    - id: surfer
      name: dsh-surfer
